<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>군포시 생활시설 지도</title>

    <!-- Leaflet 지도 라이브러리 (무료/오픈소스) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 
                         'Malgun Gothic', sans-serif;
            background: #f5f5f5;
        }

        .header {
            background: #1a56db;
            color: white;
            padding: 14px 20px;
            text-align: center;
        }
        .header h1 { font-size: 20px; font-weight: 700; }
        .header p { font-size: 12px; opacity: 0.85; margin-top: 4px; }

        .controls {
            background: white;
            padding: 12px 16px;
            border-bottom: 1px solid #e0e0e0;
        }
        .search-box {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }
        .search-box input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }
        .search-box input:focus { border-color: #1a56db; }
        .search-box button {
            padding: 10px 18px;
            background: #1a56db;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            white-space: nowrap;
        }
        .search-box button:hover { background: #1e40af; }

        .filter-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .filter-btn {
            padding: 7px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 20px;
            background: white;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .filter-btn.active {
            color: white;
            border-color: transparent;
        }

        .dong-filter {
            margin-top: 8px;
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        .dong-filter label {
            font-size: 13px;
            font-weight: 600;
            color: #374151;
            white-space: nowrap;
        }
        .dong-filter select {
            padding: 6px 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
            background: white;
        }

        .result-count {
            font-size: 12px;
            color: #6b7280;
            margin-top: 8px;
        }

        #map {
            width: 100%;
            height: calc(100vh - 230px);
            min-height: 400px;
        }

        .popup-content {
            font-family: 'Pretendard', 'Malgun Gothic', sans-serif;
            min-width: 240px;
        }
        .popup-content .popup-type {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            color: white;
            margin-bottom: 6px;
        }
        .popup-content h3 {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #111827;
        }
        .popup-content .info-row {
            display: flex;
            gap: 6px;
            margin-bottom: 4px;
            font-size: 12px;
        }
        .popup-content .info-label {
            color: #6b7280;
            white-space: nowrap;
            min-width: 48px;
        }
        .popup-content .info-value {
            color: #111827;
            word-break: keep-all;
        }
        .popup-content .info-value a {
            color: #1a56db;
            text-decoration: none;
        }
        .popup-content .items-box {
            margin-top: 8px;
            padding: 8px 10px;
            background: #f3f4f6;
            border-radius: 4px;
            font-size: 12px;
            color: #374151;
        }
        .popup-content .items-label {
            font-weight: 600;
            margin-bottom: 2px;
        }

        @media (max-width: 768px) {
            .header h1 { font-size: 16px; }
            #map { height: calc(100vh - 260px); }
            .filter-btn { padding: 6px 10px; font-size: 12px; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>군포시 생활시설 지도</h1>
        <p id="headerDesc">생활시설 위치 안내</p>
    </div>

    <div class="controls">
        <div class="search-box">
            <input type="text" id="searchInput" 
                   placeholder="시설명, 주소, 품목으로 검색하세요" 
                   onkeypress="if(event.key==='Enter') search()">
            <button onclick="search()">검색</button>
        </div>
        <div class="filter-buttons" id="filterButtons"></div>
        <div class="dong-filter">
            <label>행정동:</label>
            <select id="dongSelect" onchange="updateMarkers()">
                <option value="전체">전체</option>
            </select>
        </div>
        <div class="result-count" id="resultCount"></div>
    </div>

    <div id="map"></div>

    <script>
    var map;
    var allData = [];
    var markers = [];
    var activeTypes = new Set();
    var searchKeyword = "";

    var colorPalette = [
        "#2563eb", "#16a34a", "#d97706", "#dc2626", 
        "#7c3aed", "#0891b2", "#be185d", "#65a30d"
    ];
    var typeColors = {};

    function createIcon(type) {
        var color = typeColors[type] || "#6b7280";
        var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="28" height="40" viewBox="0 0 28 40">' +
            '<path d="M14 0C6.3 0 0 6.3 0 14c0 10.5 14 26 14 26s14-15.5 14-26C28 6.3 21.7 0 14 0z" fill="' + color + '"/>' +
            '<circle cx="14" cy="14" r="7" fill="white"/>' +
            '</svg>';
        return L.divIcon({
            html: svg,
            iconSize: [28, 40],
            iconAnchor: [14, 40],
            popupAnchor: [0, -40],
            className: ''
        });
    }

    function createPopup(item) {
        var color = typeColors[item.type] || "#6b7280";
        var html = '<div class="popup-content">';
        html += '<span class="popup-type" style="background:' + color + '">' + item.type + '</span>';
        html += '<h3>' + item.name + '</h3>';
        html += '<div class="info-row"><span class="info-label">주소</span><span class="info-value">' + item.address + '</span></div>';
        if (item.dong) {
            html += '<div class="info-row"><span class="info-label">행정동</span><span class="info-value">' + item.dong + '</span></div>';
        }
        if (item.phone) {
            html += '<div class="info-row"><span class="info-label">연락처</span><span class="info-value"><a href="tel:' + item.phone + '">' + item.phone + '</a></span></div>';
        }
        if (item.items) {
            html += '<div class="items-box"><div class="items-label">취급 품목</div>' + item.items + '</div>';
        }
        html += '</div>';
        return html;
    }

    function updateMarkers() {
        markers.forEach(function(m) { map.removeLayer(m); });
        markers = [];

        var dongFilter = document.getElementById("dongSelect").value;
        var count = 0;
        var bounds = [];

        allData.forEach(function(item) {
            if (!activeTypes.has(item.type)) return;
            if (dongFilter !== "전체" && item.dong !== dongFilter) return;

            if (searchKeyword) {
                var kw = searchKeyword.toLowerCase();
                var searchable = (item.name + " " + item.address + " " + item.dong + " " + item.items + " " + item.type).toLowerCase();
                if (searchable.indexOf(kw) === -1) return;
            }

            var marker = L.marker([item.lat, item.lng], {
                icon: createIcon(item.type)
            }).bindPopup(createPopup(item), { maxWidth: 300 });

            marker.addTo(map);
            markers.push(marker);
            bounds.push([item.lat, item.lng]);
            count++;
        });

        document.getElementById("resultCount").textContent = 
            "총 " + count + "개 시설이 표시되고 있습니다";

        if (bounds.length > 0) {
            map.fitBounds(bounds, { padding: [30, 30] });
        }
    }

    function search() {
        searchKeyword = document.getElementById("searchInput").value.trim();
        updateMarkers();
    }

    function filterCategory(btn) {
        var type = btn.getAttribute("data-type");

        if (type === "전체") {
            var allBtns = document.querySelectorAll(".filter-btn");
            var allActive = true;
            allBtns.forEach(function(b) {
                if (b.getAttribute("data-type") !== "전체" && !b.classList.contains("active")) {
                    allActive = false;
                }
            });
            if (allActive) {
                activeTypes.clear();
                allBtns.forEach(function(b) {
                    b.classList.remove("active");
                    b.style.background = "white";
                    b.style.color = "#374151";
                    b.style.borderColor = "#e0e0e0";
                });
            } else {
                Object.keys(typeColors).forEach(function(t) { activeTypes.add(t); });
                allBtns.forEach(function(b) {
                    b.classList.add("active");
                    var t2 = b.getAttribute("data-type");
                    if (t2 === "전체") {
                        b.style.background = "#374151";
                        b.style.color = "white";
                        b.style.borderColor = "#374151";
                    } else {
                        b.style.background = typeColors[t2];
                        b.style.color = "white";
                        b.style.borderColor = typeColors[t2];
                    }
                });
            }
        } else {
            if (activeTypes.has(type)) {
                activeTypes.delete(type);
                btn.classList.remove("active");
                btn.style.background = "white";
                btn.style.color = "#374151";
                btn.style.borderColor = "#e0e0e0";
            } else {
                activeTypes.add(type);
                btn.classList.add("active");
                btn.style.background = typeColors[type];
                btn.style.color = "white";
                btn.style.borderColor = typeColors[type];
            }
            var allBtn = document.querySelector('.filter-btn[data-type="전체"]');
            if (activeTypes.size === Object.keys(typeColors).length) {
                allBtn.classList.add("active");
                allBtn.style.background = "#374151";
                allBtn.style.color = "white";
                allBtn.style.borderColor = "#374151";
            } else {
                allBtn.classList.remove("active");
                allBtn.style.background = "white";
                allBtn.style.color = "#374151";
                allBtn.style.borderColor = "#e0e0e0";
            }
        }
        updateMarkers();
    }

    function buildFilters(data) {
        var types = [];
        var dongs = new Set();

        data.forEach(function(item) {
            if (item.type && types.indexOf(item.type) === -1) {
                types.push(item.type);
            }
            if (item.dong) dongs.add(item.dong);
        });

        types.forEach(function(t, i) {
            typeColors[t] = colorPalette[i % colorPalette.length];
            activeTypes.add(t);
        });

        document.getElementById("headerDesc").textContent = types.join(" / ");

        var container = document.getElementById("filterButtons");

        var allBtn = document.createElement("button");
        allBtn.className = "filter-btn active";
        allBtn.setAttribute("data-type", "전체");
        allBtn.textContent = "전체";
        allBtn.style.background = "#374151";
        allBtn.style.color = "white";
        allBtn.style.borderColor = "#374151";
        allBtn.onclick = function() { filterCategory(this); };
        container.appendChild(allBtn);

        types.forEach(function(t) {
            var btn = document.createElement("button");
            btn.className = "filter-btn active";
            btn.setAttribute("data-type", t);
            btn.textContent = t;
            btn.style.background = typeColors[t];
            btn.style.color = "white";
            btn.style.borderColor = typeColors[t];
            btn.onclick = function() { filterCategory(this); };
            container.appendChild(btn);
        });

        var dongSelect = document.getElementById("dongSelect");
        var sortedDongs = Array.from(dongs).sort();
        sortedDongs.forEach(function(d) {
            var opt = document.createElement("option");
            opt.value = d;
            opt.textContent = d;
            dongSelect.appendChild(opt);
        });
    }

    function init() {
        map = L.map("map").setView([37.3615, 126.9352], 14);

        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            attribution: '&copy; OpenStreetMap',
            maxZoom: 19
        }).addTo(map);

        fetch("data.json")
            .then(function(response) {
                if (!response.ok) throw new Error("data.json 파일을 찾을 수 없습니다");
                return response.json();
            })
            .then(function(data) {
                allData = data;
                buildFilters(data);
                updateMarkers();
            })
            .catch(function(error) {
                console.error("데이터 로드 오류:", error);
                document.getElementById("resultCount").textContent = 
                    "data.json 파일을 불러올 수 없습니다. 같은 폴더에 data.json이 있는지 확인하세요.";
            });
    }

    window.addEventListener("load", init);
    </script>

</body>
</html>
