<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리 동네 생활시설 지도</title>
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=41cb6164e3418fb3064c2418a4167d4a"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont,
                         'Malgun Gothic', '맑은 고딕', sans-serif;
            background: #f5f5f5;
        }

        /* ===== 상단 헤더 ===== */
        .header {
            background: #1a56db;
            color: white;
            padding: 14px 20px;
            text-align: center;
        }
        .header h1 { font-size: 20px; font-weight: 700; }
        .header p { font-size: 12px; opacity: 0.85; margin-top: 4px; }

        /* ===== 검색 + 필터 ===== */
        .controls {
            background: white;
            padding: 12px 16px;
            border-bottom: 1px solid #e0e0e0;
        }
        .search-box {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }
        .search-box input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }
        .search-box input:focus { border-color: #1a56db; }
        .search-box button {
            padding: 10px 18px;
            background: #1a56db;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            white-space: nowrap;
        }
        .search-box button:hover { background: #1e40af; }

        .filter-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .filter-btn {
            padding: 7px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 20px;
            background: white;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .filter-btn.active { color: white; border-color: transparent; }
        .filter-btn[data-type="전체"].active { background: #374151; border-color: #374151; }
        .filter-btn[data-type="종량제봉투 판매소"].active { background: #2563eb; border-color: #2563eb; }
        .filter-btn[data-type="공구대여소"].active { background: #16a34a; border-color: #16a34a; }
        .filter-btn[data-type="무인패트병수거함"].active { background: #d97706; border-color: #d97706; }

        .result-count {
            font-size: 12px;
            color: #6b7280;
            margin-top: 8px;
        }

        /* ===== 지도 ===== */
        #map {
            width: 100%;
            height: calc(100vh - 200px);
            min-height: 400px;
        }

        /* ===== 커스텀 오버레이 (팝업) ===== */
        .overlay-wrap {
            position: relative;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            min-width: 250px;
            max-width: 300px;
            font-family: 'Pretendard', 'Malgun Gothic', sans-serif;
            overflow: hidden;
        }
        .overlay-wrap .overlay-close {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 24px;
            height: 24px;
            background: #f3f4f6;
            border: none;
            border-radius: 50%;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #6b7280;
            z-index: 10;
        }
        .overlay-wrap .overlay-close:hover {
            background: #e5e7eb;
            color: #111827;
        }
        .overlay-wrap .overlay-body {
            padding: 16px;
        }
        .overlay-wrap .overlay-type {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            color: white;
            margin-bottom: 8px;
        }
        .type-봉투 { background: #2563eb; }
        .type-공구 { background: #16a34a; }
        .type-패트병 { background: #d97706; }

        .overlay-wrap h3 {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 10px;
            color: #111827;
            padding-right: 24px;
        }
        .overlay-wrap .info-row {
            display: flex;
            gap: 6px;
            margin-bottom: 5px;
            font-size: 12px;
            line-height: 1.5;
        }
        .overlay-wrap .info-label {
            color: #6b7280;
            white-space: nowrap;
            min-width: 48px;
        }
        .overlay-wrap .info-value {
            color: #111827;
            word-break: keep-all;
        }
        .overlay-wrap .items-box {
            margin-top: 10px;
            padding: 10px 12px;
            background: #f9fafb;
            border: 1px solid #f3f4f6;
            border-radius: 6px;
            font-size: 12px;
            color: #374151;
            line-height: 1.5;
        }
        .overlay-wrap .items-label {
            font-weight: 600;
            margin-bottom: 3px;
            color: #111827;
        }

        /* 팝업 아래 화살표 */
        .overlay-arrow {
            display: flex;
            justify-content: center;
            margin-top: -1px;
        }
        .overlay-arrow span {
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 10px solid white;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.1));
        }

        /* ===== 모바일 ===== */
        @media (max-width: 768px) {
            .header h1 { font-size: 16px; }
            #map { height: calc(100vh - 220px); }
            .filter-btn { padding: 6px 10px; font-size: 12px; }
            .overlay-wrap { min-width: 220px; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>우리 동네 생활시설 지도</h1>
        <p>종량제봉투 판매소 / 공구대여소 / 무인패트병수거함</p>
    </div>

    <div class="controls">
        <div class="search-box">
            <input type="text" id="searchInput"
                   placeholder="시설명, 주소, 품목으로 검색하세요"
                   onkeypress="if(event.key==='Enter') search()">
            <button onclick="search()">검색</button>
        </div>
        <div class="filter-buttons">
            <button class="filter-btn active" data-type="전체" onclick="filterCategory(this)">전체</button>
            <button class="filter-btn active" data-type="종량제봉투 판매소" onclick="filterCategory(this)">종량제봉투 판매소</button>
            <button class="filter-btn active" data-type="공구대여소" onclick="filterCategory(this)">공구대여소</button>
            <button class="filter-btn active" data-type="무인패트병수거함" onclick="filterCategory(this)">무인패트병수거함</button>
        </div>
        <div class="result-count" id="resultCount"></div>
    </div>

    <div id="map"></div>

    <script>
    // ===== 전역 변수 =====
    var map;
    var allData = [];
    var markers = [];
    var currentOverlay = null;
    var activeTypes = new Set(["종량제봉투 판매소", "공구대여소", "무인패트병수거함"]);
    var searchKeyword = "";

    // ===== 시설 유형별 색상 =====
    var typeColors = {
        "종량제봉투 판매소": "#2563eb",
        "공구대여소": "#16a34a",
        "무인패트병수거함": "#d97706"
    };

    // ===== 마커 이미지 생성 =====
    function createMarkerImage(type) {
        var color = typeColors[type] || "#6b7280";
        var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="28" height="40" viewBox="0 0 28 40">' +
            '<path d="M14 0C6.3 0 0 6.3 0 14c0 10.5 14 26 14 26s14-15.5 14-26C28 6.3 21.7 0 14 0z" fill="' + color + '"/>' +
            '<circle cx="14" cy="14" r="7" fill="white"/>' +
            '</svg>';
        var src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
        return new kakao.maps.MarkerImage(
            src,
            new kakao.maps.Size(28, 40),
            { offset: new kakao.maps.Point(14, 40) }
        );
    }

    // ===== 팝업 닫기 (전역 함수) =====
    function closeOverlay() {
        if (currentOverlay) {
            currentOverlay.setMap(null);
            currentOverlay = null;
        }
    }

    // ===== 팝업 HTML 생성 =====
    function createPopupHTML(item) {
        var typeClass = "";
        if (item.type.indexOf("종량제봉투") !== -1) typeClass = "type-봉투";
        else if (item.type.indexOf("공구") !== -1) typeClass = "type-공구";
        else if (item.type.indexOf("패트병") !== -1 || item.type.indexOf("수거함") !== -1) typeClass = "type-패트병";

        var html = '<div class="overlay-wrap">';
        html += '  <div class="overlay-body">';
        html += '    <button class="overlay-close" onclick="closeOverlay()">✕</button>';
        html += '    <span class="overlay-type ' + typeClass + '">' + item.type + '</span>';
        html += '    <h3>' + item.name + '</h3>';
        html += '    <div class="info-row"><span class="info-label">주소</span><span class="info-value">' + item.address + '</span></div>';
        if (item.dong && item.dong !== "nan" && item.dong !== "") {
            html += '    <div class="info-row"><span class="info-label">행정동</span><span class="info-value">' + item.dong + '</span></div>';
        }
        if (item.items && item.items !== "nan" && item.items !== "") {
            html += '    <div class="items-box"><div class="items-label">취급 품목</div>' + item.items + '</div>';
        }
        html += '  </div>';
        html += '  <div class="overlay-arrow"><span></span></div>';
        html += '</div>';
        return html;
    }

    // ===== 마커 표시/갱신 =====
    function updateMarkers() {
        // 기존 마커 제거
        markers.forEach(function(m) { m.setMap(null); });
        markers = [];
        closeOverlay();

        var bounds = new kakao.maps.LatLngBounds();
        var count = 0;

        allData.forEach(function(item) {
            // 카테고리 필터
            if (!activeTypes.has(item.type)) return;

            // 검색 필터
            if (searchKeyword) {
                var kw = searchKeyword.toLowerCase();
                var searchable = (item.name + " " + item.address + " " + item.dong + " " + item.items + " " + item.type).toLowerCase();
                if (searchable.indexOf(kw) === -1) return;
            }

            var position = new kakao.maps.LatLng(item.lat, item.lng);

            // 마커 생성
            var marker = new kakao.maps.Marker({
                position: position,
                image: createMarkerImage(item.type),
                map: map
            });

            // 마커 클릭 이벤트
            (function(marker, item, position) {
                kakao.maps.event.addListener(marker, 'click', function() {
                    closeOverlay();
                    var overlay = new kakao.maps.CustomOverlay({
                        content: createPopupHTML(item),
                        position: position,
                        yAnchor: 1.15,
                        xAnchor: 0.5
                    });
                    overlay.setMap(map);
                    currentOverlay = overlay;
                });
            })(marker, item, position);

            markers.push(marker);
            bounds.extend(position);
            count++;
        });

        // 결과 개수 표시
        document.getElementById("resultCount").textContent =
            "총 " + count + "개 시설이 표시되고 있습니다";

        // 마커가 있으면 지도 범위 조정
        if (count > 0) {
            map.setBounds(bounds);
        }
    }

    // ===== 검색 =====
    function search() {
        searchKeyword = document.getElementById("searchInput").value.trim();
        updateMarkers();
    }

    // ===== 카테고리 필터 =====
    function filterCategory(btn) {
        var type = btn.getAttribute("data-type");

        if (type === "전체") {
            var allActive = activeTypes.size === 3;
            var allBtns = document.querySelectorAll(".filter-btn");

            if (allActive) {
                activeTypes.clear();
                allBtns.forEach(function(b) { b.classList.remove("active"); });
            } else {
                activeTypes = new Set(["종량제봉투 판매소", "공구대여소", "무인패트병수거함"]);
                allBtns.forEach(function(b) { b.classList.add("active"); });
            }
        } else {
            if (activeTypes.has(type)) {
                activeTypes.delete(type);
                btn.classList.remove("active");
            } else {
                activeTypes.add(type);
                btn.classList.add("active");
            }
            var allBtn = document.querySelector('.filter-btn[data-type="전체"]');
            if (activeTypes.size === 3) {
                allBtn.classList.add("active");
            } else {
                allBtn.classList.remove("active");
            }
        }
        updateMarkers();
    }

    // ===== 지도 클릭 시 팝업 닫기 =====
    function initMapClickClose() {
        kakao.maps.event.addListener(map, 'click', function() {
            closeOverlay();
        });
    }

    // ===== 초기화 =====
    function init() {
        var container = document.getElementById("map");
        var options = {
            center: new kakao.maps.LatLng(37.5665, 126.978),
            level: 8
        };
        map = new kakao.maps.Map(container, options);

        // 줌 컨트롤 추가
        var zoomControl = new kakao.maps.ZoomControl();
        map.addControl(zoomControl, kakao.maps.ControlPosition.RIGHT);

        // 지도 타입 컨트롤 추가 (일반/위성 전환)
        var mapTypeControl = new kakao.maps.MapTypeControl();
        map.addControl(mapTypeControl, kakao.maps.ControlPosition.TOPRIGHT);

        // 지도 클릭 시 팝업 닫기
        initMapClickClose();

        // 데이터 불러오기
        fetch("data.json")
            .then(function(response) {
                if (!response.ok) throw new Error("data.json을 찾을 수 없습니다");
                return response.json();
            })
            .then(function(data) {
                allData = data;
                updateMarkers();
            })
            .catch(function(error) {
                console.error("데이터 로드 오류:", error);
                document.getElementById("resultCount").textContent =
                    "data.json 파일을 불러올 수 없습니다. 같은 폴더에 있는지 확인하세요.";
            });
    }

    window.addEventListener("load", init);
    </script>

</body>
</html>
